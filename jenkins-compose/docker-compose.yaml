  # -------------------------
  # JENKINS (ADDED)
  # -------------------------

  jenkins:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    user: root
    restart: always #restart: always  # This ensures it rebuilds/restarts if shutdown or crashed
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false