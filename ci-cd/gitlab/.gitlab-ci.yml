stages:
  - build
  - security-check

variables:
  IMAGE_NAME: "demo/my-app"
  IMAGE_TAG: "$CI_PIPELINE_ID"
  REGISTRY_IMAGE: "$CI_REGISTRY/$IMAGE_NAME"
  ANCHORECTL_VERSION: "5.27.1"

##################################################
# Hidden job to call when setting up anchorectl
# anchorectl configuration are set as CI/CD variables
##################################################
.anchore_setup:
    - |
      echo "=========================================================="
      echo "INSTALLING ANCHORECTL"
      echo "=========================================================="
      if ! command -v anchorectl &> /dev/null; then
        echo "Downloading matching anchorectl binary from enterprise mirror..."
        curl -o anchorectl.tar.gz https://anchorectl-releases.anchore.io/anchorectl/v${ANCHORECTL_VERSION}/anchorectl_${ANCHORECTL_VERSION}_linux_amd64.tar.gz
        tar -xzf anchorectl.tar.gz
        chmod +x anchorectl
        mv anchorectl /usr/local/bin/
      else
        echo "anchorectl already installed, skipping download."
      fi
      if ! anchorectl version; then
        echo "ERROR: anchorectl not installed or cannot be found."
        exit 1
      fi
      echo "SUCCESS: anchorectl installed."

      echo "=========================================================="
      echo "RUNNING CONNECTIVITY CHECK TO ANCHORE API"
      echo "=========================================================="
      echo "Verifying network route to $ANCHORECTL_URL..."

      if ! anchorectl system status; then
        echo "ERROR: Cannot reach or authenticate with Anchore Enterprise API."
        exit 1
      fi
      echo "SUCCESS: Connected to Anchore Enterprise backend services."

# ==========================================================
# STAGE 1: CONTAINER BUILD AND PUSH
# ==========================================================
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$REGISTRY_IMAGE:$IMAGE_TAG" -t "$REGISTRY_IMAGE:latest" .
    - docker push "$REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$REGISTRY_IMAGE:latest"

# ==========================================================
# STAGE 2: ANCHORE ANALYSIS
# ==========================================================
anchore-scan:
  stage: security-check
  extends: .anchore_setup
  needs:
    - build
  variables:
    ANCHORECTL_REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:

    # 3. Add private registry information (GitLab Container Registry in this case)
    - |
      echo "=========================================================="
      echo "LINKING PRIVATE GITLAB CONTAINER REGISTRY TO ANCHORE"
      echo "=========================================================="

      if anchorectl registry list | grep -q "$CI_REGISTRY"; then
        echo "Registry $CI_REGISTRY is already linked. Skipping creation."
      else
        echo "Registering new registry credentials..."
        anchorectl registry add "$CI_REGISTRY" --username "$CI_REGISTRY_USER"
      fi

    # 4. Trigger Analysis & Get Vulnerabilities
    - |
      echo "=========================================================="
      echo "TRIGGER ANCHORE ANALYSIS ON IMAGE"
      echo "=========================================================="
      echo "Requesting Anchore Enterprise to pull and analyze: $REGISTRY_IMAGE:$IMAGE_TAG"

      anchorectl image add "$REGISTRY_IMAGE:$IMAGE_TAG" --wait

      echo "Showing Vulnerability Results:"
      anchorectl image vulnerabilities "$REGISTRY_IMAGE:$IMAGE_TAG"

      echo "Checking for policy compliance..."
      anchorectl image check "$REGISTRY_IMAGE:$IMAGE_TAG" --fail-based-on-results
